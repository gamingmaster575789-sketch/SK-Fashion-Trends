{% extends "base.html" %}{% block title %}Edit Product | SK{% endblock %}{% block content %}
<div class="shell"><div class="form-card wide-form"><div class="eyebrow">Admin / Product image</div><h1>Edit product</h1>
{% if product['image'] %}<div class="image-preview"><img src="{{ product['image'] }}" alt="{{ product['name'] }}"></div>{% endif %}
<form method="POST" enctype="multipart/form-data">
<div class="field"><label>Product Name</label><input name="name" value="{{ product['name'] }}" required></div>
<div class="field"><label>Price</label><input type="number" step="0.01" name="price" value="{{ product['price'] }}" required></div>
<div class="field"><label>Stock</label><input type="number" name="stock" value="{{ product['stock'] }}" required></div>
<div class="field"><label>Description</label><textarea name="description" rows="4">{{ product['description'] }}</textarea></div>
<div class="field"><label>Replace image from your computer</label><input type="file" name="image_file" accept="image/png,image/jpeg,image/webp,image/gif"><small class="field-help">Recommended: JPG/PNG/WebP, up to 5 MB.</small></div>
<div class="field"><label>Or use an image URL</label><input name="image" value="{{ product['image'] or '' }}" placeholder="https://..."><small class="field-help">Uploading a file takes priority over this URL.</small></div>
<button class="btn btn-dark">Save product & image</button>
</form></div></div>{% endblock %}
