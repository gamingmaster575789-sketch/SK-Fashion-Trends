{% extends "base.html" %}{% block title %}Create Account | SK{% endblock %}{% block content %}
<div class="shell"><div class="form-card"><div class="eyebrow">Join SK</div><h1>Create account</h1>
<form method="POST"><div class="field"><label>Full Name</label><input name="name" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Password</label><input type="password" name="password" required></div><button class="btn btn-dark">Create Account</button></form>
<div class="link-row">Already registered? <a href="{{ url_for('login') }}">Login</a></div></div></div>{% endblock %}
