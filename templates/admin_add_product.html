{% extends "base.html" %}{% block title %}Add Product | SK{% endblock %}{% block content %}
<div class="shell"><div class="form-card wide-form"><div class="eyebrow">Admin</div><h1>Add product</h1><form method="POST" enctype="multipart/form-data">
<div class="field"><label>Product Name</label><input name="name" required></div>
<div class="field"><label>Category</label><select name="category_id">{% for c in categories %}<option value="{{ c['id'] }}">{{ c['name'] }}</option>{% endfor %}</select></div>
<div class="field"><label>Price</label><input type="number" step="0.01" name="price" required></div>
<div class="field"><label>Stock</label><input type="number" name="stock" required></div>
<div class="field"><label>Description</label><textarea name="description" rows="4"></textarea></div>
<div class="field"><label>Upload product image</label><input type="file" name="image_file" accept="image/png,image/jpeg,image/webp,image/gif"><small class="field-help">Recommended: JPG/PNG/WebP, up to 5 MB.</small></div>
<div class="field"><label>Or paste an image URL</label><input name="image" placeholder="https://..."><small class="field-help">Uploading a file takes priority over this URL.</small></div>
<button class="btn btn-dark">Add product</button></form></div></div>{% endblock %}
